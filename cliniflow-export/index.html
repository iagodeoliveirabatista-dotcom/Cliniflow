<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliniflow — Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="supabase.js"></script>

  <script src="config.js"></script>
  <script src="supabase-client.js?v=12"></script>

  <script type="text/babel" src="tweaks-panel.jsx?v=5"></script>
  <script type="text/babel" src="cliniflow-components.jsx?v=13"></script>
  <script type="text/babel" src="patients-components.jsx?v=11"></script>
  <script type="text/babel" src="reports-components.jsx?v=5"></script>
  <script type="text/babel" src="automation-components.jsx?v=6"></script>

  <style>
    :root {
      /* Mapeamento de Cores Supabase */
      --supabase-brand: #3ecf8e;
      --supabase-brand-hover: #30b27b;
      --supabase-bg-main: #171717;
      --supabase-bg-studio: #0f0f0f;
      --supabase-bg-card: #1e1e1e;
      --supabase-border: #2e2e2e;
      
      /* Texto */
      --supabase-text: #ffffff;
      --supabase-text-light: #ededed;
      --supabase-text-muted: #a0a0a0;
      
      /* Cantos e Transições */
      --radius-studio: 6px;
      --transition-studio: all 0.2s ease-in-out;

      /* Polimento "premium": easing, elevação e glow do brand — usados
         globalmente abaixo, não mudam nenhum token que os componentes já leem. */
      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.28);
      --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-lg: 0 20px 48px -16px rgba(0,0,0,0.55);
      --shadow-brand: 0 0 0 3px rgba(62,207,142,0.15);
      --supabase-bg-hover: #1c1c1c;
      --supabase-bg-input: #161616;
      --supabase-icon-inactive: #3a3a3a;
      --supabase-border-strong: #3d3d3d;

      /* Cores de sinalização da agenda. Existem por tema porque o mesmo hex não
         serve os dois: #3ecf8e é legível sobre #0f0f0f e some sobre branco
         (1,96:1). Os tons claros abaixo são os do tema ESCURO. */
      --st-confirmado: #3ecf8e;
      --st-pendente:   #9ca3af;
      --st-remarcado:  #f59e0b;
      --st-cancelado:  #ef4444;
      --st-solicitado: #c084fc;
      --st-recusado:   #94a3b8;
    }
    :root[data-theme="light"] {
      --supabase-bg-main: #f3f4f6;
      --supabase-bg-studio: #e9ebef;
      --supabase-bg-card: #ffffff;
      --supabase-border: #d8dce1;
      --supabase-text: #1f2937;
      --supabase-text-light: #4b5563;
      --supabase-text-muted: #8c92a0;

      --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
      --shadow-md: 0 8px 24px -8px rgba(15,23,42,0.12), 0 1px 2px rgba(15,23,42,0.05);
      --shadow-lg: 0 24px 56px -20px rgba(15,23,42,0.2);
      --shadow-brand: 0 0 0 3px rgba(62,207,142,0.18);
      --supabase-bg-hover: #eceef1;
      --supabase-bg-input: #eef0f2;
      --supabase-icon-inactive: #aeb4bd;
      --supabase-border-strong: #c8ccd2;

      /* Mesmas famílias de cor, escurecidas até o texto do badge passar de
         4,5:1 SOBRE O PRÓPRIO PREENCHIMENTO (14% da mesma cor sobre o branco do
         card) — que é o pior caso da tela, não sobre o branco puro.
         Não clareie sem remedir: o primeiro chute (#047857) dava só 3,97. */
      --st-confirmado: #065f46;
      --st-pendente:   #4b5563;
      --st-remarcado:  #92400e;
      --st-cancelado:  #b91c1c;
      --st-solicitado: #7e22ce;
      --st-recusado:   #374151;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--supabase-bg-main);
      background-image: radial-gradient(circle at 12% -10%, rgba(62,207,142,0.06), transparent 42%);
      background-attachment: fixed;
      color: var(--supabase-text-light);
    }
    #root { animation: fadeIn 0.4s var(--ease-premium); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--supabase-border); border-radius: var(--radius-studio); transition: background 0.2s var(--ease-premium); }
    ::-webkit-scrollbar-thumb:hover { background: var(--supabase-text-muted); }
    ::selection { background: rgba(62,207,142,0.28); color: var(--supabase-text); }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    /* Feedback tátil universal — cobre todo botão/campo dos 5 arquivos sem
       precisar editar cada componente. Só adiciona propriedades que nenhum
       inline style já define (transform, filter, box-shadow em hover/focus). */
    button:not(:disabled) { transition: transform 0.15s var(--ease-premium), filter 0.15s var(--ease-premium), opacity 0.15s var(--ease-premium); }
    button:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.06); }
    button:not(:disabled):active { transform: translateY(0) scale(0.98); filter: brightness(0.97); }
    button:disabled { cursor: default; }

    input, textarea, select { transition: border-color 0.15s var(--ease-premium), box-shadow 0.15s var(--ease-premium); }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--supabase-brand) !important;
      box-shadow: var(--shadow-brand);
    }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--supabase-brand);
      outline-offset: 2px;
    }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body style="font-family: Inter; font-size: 15px">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const {
      TweaksPanel, TweakSection, TweakRadio, TweakToggle, useTweaks,
    } = window;
    const {
      APPOINTMENTS, STATUS_CFG,
      Sidebar, ListView, CalendarView, KanbanView, DetailPanel,
      PATIENTS, PatientsView,
      AddPatientModal, EditPatientModal, NewAppointmentModal, AprovarPedidoModal,
      extrairPreferencia,
      ReportsView,
      AutomationView,
      AtendimentosView,
    } = window;
    const SB = window.SupabaseService;

    // ── Constants ──────────────────────────────────────────────────────────

    const ACCENT_MAP = {
      verde:   '#3ecf8e',
      azul:    '#5b8cff',
      violeta: '#a78bfa',
      cyan:    '#22d3ee',
    };

    const FILTER_TABS = [
      { id:'todas',       label:'Todas'       },
      { id:'confirmed',   label:'Confirmadas' },
      { id:'pending',     label:'Pendentes'   },
      { id:'solicitado',  label:'Solicitadas' },
      { id:'rescheduled', label:'Reagend.' },
      { id:'canceled',    label:'Canceladas'  },
    ];

    const LAYOUT_ICONS = {
      lista:      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>,
      calendário: <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>,
      kanban:     <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h4v13H4zm6-3h4v8h-4zm6 5h4v11h-4z"/></svg>,
    };

    // ── App ────────────────────────────────────────────────────────────────

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "layout": "lista",
      "accent": "verde",
      "compacto": false,
      "theme": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [appts, setAppts] = useState([...APPOINTMENTS]);
      const [patients, setPatients] = useState([...PATIENTS]);
      const [profissionais, setProfissionais] = useState([]);
      const [botAtivo, setBotAtivo] = useState(true);
      const [selectedId, setSelectedId] = useState(null);
      const [filter, setFilter] = useState('todas');
      const [page, setPage] = useState('agenda');
      const [newApptOpen, setNewApptOpen] = useState(false);
      const [pedidoEmAprovacao, setPedidoEmAprovacao] = useState(null);
      const [newPatientOpen, setNewPatientOpen] = useState(false);
      const [editingPatient, setEditingPatient] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [dbConnected, setDbConnected] = useState(false);
      const [currentMonday, setCurrentMonday] = useState(() => {
        const now = new Date();
        const monday = new Date(now);
        monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
        monday.setHours(0, 0, 0, 0);
        return monday;
      });

      const accent = ACCENT_MAP[t.accent] || '#3ecf8e';
      const selected = appts.find(a => a.id === selectedId) || null;

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', t.theme);
      }, [t.theme]);

      // Preferências de aparência persistem entre sessões (o useTweaks sozinho
      // não persiste — ele só notifica a ferramenta externa de edit-mode).
      useEffect(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('cliniflow_prefs') || 'null');
          if (saved && (saved.theme || saved.accent)) setTweak(saved);
        } catch (_) { /* prefs corrompidas: ignora e segue com o default */ }
      }, []);
      useEffect(() => {
        try {
          localStorage.setItem('cliniflow_prefs', JSON.stringify({ theme: t.theme, accent: t.accent }));
        } catch (_) { /* storage cheio/bloqueado: preferência só não persiste */ }
      }, [t.theme, t.accent]);

      // ── Load real data from Supabase on mount ─────────────────────────
      useEffect(() => {
        if (!SB || !SB.isConnected()) return;
        setDbConnected(true);

        // Load patients
        SB.fetchPacientes().then(res => {
          if (res.data) {
            setPatients(res.data.map(SB.pacienteToPatient));
          }
        });

        // Load profissionais
        SB.fetchProfissionais().then(res => {
          if (res.data) {
            setProfissionais(res.data);
          }
        });

        // Load clinic settings (kill switch do bot de IA)
        SB.fetchClinicSettings().then(res => {
          if (res.data) {
            setBotAtivo(res.data.bot_ativo);
          }
        });

        // Sincronização em tempo real (Supabase Realtime) para pacientes
        const subPacientes = SB.subscribeToPacientes((payload) => {
          SB.fetchPacientes().then(res => {
            if (res.data) {
              setPatients(res.data.map(SB.pacienteToPatient));
            }
          });
        });

        // Sincronização em tempo real para profissionais
        const subProfissionais = SB.subscribeToProfissionais((payload) => {
          SB.fetchProfissionais().then(res => {
            if (res.data) {
              setProfissionais(res.data);
            }
          });
        });

        return () => {
          if (subPacientes) subPacientes.unsubscribe();
          if (subProfissionais) subProfissionais.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!SB || !SB.isConnected()) return;

        const sunday = new Date(currentMonday);
        sunday.setDate(currentMonday.getDate() + 6);
        sunday.setHours(23, 59, 59, 999);

        SB.fetchConsultas({
          dataInicio: currentMonday.toISOString(),
          dataFim: sunday.toISOString(),
        }).then(res => {
          if (res.data) {
            setAppts(res.data.map(c => SB.consultaToAppointment(c, currentMonday)));
          }
        });

        // Subscribe to realtime changes
        const subConsultas = SB.subscribeToConsultas((payload) => {
          SB.fetchConsultas({
            dataInicio: currentMonday.toISOString(),
            dataFim: sunday.toISOString(),
          }).then(res => {
            if (res.data) setAppts(res.data.map(c => SB.consultaToAppointment(c, currentMonday)));
          });
        });

        return () => {
          if (subConsultas) subConsultas.unsubscribe();
        };
      }, [currentMonday]);

      // ── CRUD Operations ───────────────────────────────────────────────
      const updateConsulta = useCallback(async (id, updates) => {
        // Update locally first (optimistic)
        setAppts(prev => prev.map(a => a.id === id ? { ...a, ...updates } : a));

        // Update in Supabase if connected
        if (dbConnected) {
          const payload = { ...updates };
          if (payload.status) {
            const statusMap = { confirmed: 'confirmado', pending: 'pendente', rescheduled: 'remarcado', canceled: 'cancelado', solicitado: 'solicitado' };
            payload.status = statusMap[payload.status] || payload.status;
          }
          await SB.updateConsulta(id, payload);
        }
      }, [dbConnected]);

      // Duração não pode reusar updateConsulta genérico: o campo local do
      // agendamento é `dur`, mas a coluna no Supabase é `duracao_min` — um
      // merge genérico gravaria certo no banco e deixaria a UI desatualizada
      // até o próximo fetch. Mesmo motivo pelo qual moveAppt já tem função
      // própria em vez de reusar o genérico.
      const updateDuracao = useCallback(async (id, dur) => {
        setAppts(prev => prev.map(a => a.id === id ? { ...a, dur } : a));

        if (dbConnected) {
          await SB.updateConsulta(id, { duracao_min: dur });
        }
      }, [dbConnected]);

      const deleteAppt = useCallback(async (id) => {
        // Update locally first (optimistic)
        setAppts(prev => prev.filter(a => a.id !== id));
        setSelectedId(null);

        // Delete in Supabase if connected
        if (dbConnected) {
          await SB.deleteConsulta(id);
        }
      }, [dbConnected]);

      const moveAppt = useCallback(async (id, newDay, newTime) => {
        setAppts(prev => prev.map(a => a.id === id ? { ...a, day: newDay, time: newTime } : a));

        if (dbConnected) {
          // Calculate new date from currentMonday
          const targetDate = new Date(currentMonday);
          targetDate.setDate(currentMonday.getDate() + newDay);
          const [h, m] = newTime.split(':').map(Number);
          targetDate.setHours(h, m, 0, 0);
          await SB.updateConsulta(id, { data_hora: targetDate.toISOString() });
        }
      }, [dbConnected, currentMonday]);

      // Aprovar pedido do bot: é aqui que o pedido ganha um horário de verdade
      // e vira consulta na agenda.
      // Status vira 'pendente', NÃO 'confirmado': quem escolheu o horário foi a
      // recepção, o paciente ainda não sabe. Como 'pendente' é exatamente o que
      // `disparar-lembretes` procura, a consulta entra sozinha no lembrete de
      // 24h — o paciente recebe o template e confirma. Assim o ciclo fecha
      // mesmo que ninguém clique em "Avisar paciente".
      // E aprovar desliga a IA do paciente (decisão do dono, D-23): quem já tem
      // horário marcado passa a ser atendido por gente. Isso NÃO o deixa mudo —
      // `Grava Mensagem Inbound` e `Cria Conversa` rodam antes do gate no n8n,
      // então o que ele escrever aparece no painel Atendimentos sem resposta
      // automática. E responder ao lembrete continua funcionando: o roteiro de
      // confirmação é determinístico e o n8n abre exceção para sessão viva com
      // `consulta_id` (ARMADILHAS §37). Só falha se o n8n estiver numa versão
      // anterior à `dea36506` — aí o "ok" do paciente é descartado.
      const aprovarPedido = useCallback(async ({ id, patient_id, data_hora, duracao_min, tipo, medico }) => {
        const dt = new Date(data_hora);
        const monday = new Date(currentMonday);
        const day = Math.floor((new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) - monday) / 86400000);
        const time = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;

        setAppts(prev => prev.map(a => a.id === id
          ? { ...a, status: 'pending', day, time, dur: duracao_min, type: tipo, doctor: medico || '' }
          : a));

        if (patient_id) {
          setPatients(prev => prev.map(p => p.id === patient_id ? { ...p, bot_pausado: true } : p));
        }

        if (dbConnected) {
          await SB.updateConsulta(id, {
            data_hora, duracao_min, tipo, medico, status: 'pendente',
          });
          // Falha aqui não desfaz a aprovação: a consulta já está marcada e o
          // pior caso é a IA seguir ativa, que é o comportamento de antes.
          if (patient_id) await SB.updatePaciente(patient_id, { bot_pausado: true });
        }
      }, [dbConnected, currentMonday]);

      // Avisar o paciente é decisão da recepção (não é automático). Só existe
      // enquanto `paciente_avisado_em` for nulo — depois o botão some.
      const avisarPacienteDoHorario = useCallback(async (apt) => {
        if (!dbConnected) return { success: false, error: 'Sem conexão com o banco' };

        const dt = apt.dataHoraISO ? new Date(apt.dataHoraISO) : null;
        const quando = dt
          ? dt.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })
          : '';
        const texto = `Oi ${apt.patient.split(' ')[0]}! Seu horário ficou para ${quando}, às ${apt.time}`
          + `${apt.doctor ? ` com ${apt.doctor}` : ''}. Qualquer coisa é só me chamar por aqui!`;

        const r = await SB.enviarWhatsApp(apt.phone, texto, 'manual', apt._supabaseId || apt.id, apt.patient);
        if (r && r.success) {
          await SB.updateConsulta(apt._supabaseId || apt.id, { paciente_avisado_em: new Date().toISOString() });
          setAppts(prev => prev.map(a => a.id === apt.id ? { ...a, pacienteAvisadoEm: new Date().toISOString() } : a));
          return { success: true };
        }
        return { success: false, error: (r && r.error) || 'Falha ao enviar' };
      }, [dbConnected]);

      // Segunda-feira da semana que contém `date`. Mesma fórmula que já
      // aparece em getDayOptions/todayCol — não unificada aqui de propósito
      // (cada arquivo mantém a sua cópia; ver spec §4.4).
      function mondayOf(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        return d;
      }

      const addAppt = useCallback(async (a) => {
        const targetMonday = mondayOf(a.data);
        const diaSemHora = new Date(a.data.getFullYear(), a.data.getMonth(), a.data.getDate());
        const dayIndex = Math.round((diaSemHora - targetMonday) / 86400000); // 0=Seg ... 5=Sáb

        if (dbConnected) {
          // Find patient by name to get ID
          const pat = patients.find(p => p.name === a.patient || p.id === a.patientId);

          const statusMap = { confirmed: 'confirmado', pending: 'pendente', rescheduled: 'remarcado', canceled: 'cancelado', solicitado: 'solicitado' };
          const res = await SB.createConsulta({
            patient_id: pat?.id || null,
            data_hora: a.data.toISOString(),
            duracao_min: a.dur,
            tipo: a.type,
            medico: a.doctor,
            status: statusMap[a.status] || 'pendente',
            whatsapp_ativo: a.wa,
            preco: a.preco,
          });
          if (res.data) {
            setCurrentMonday(targetMonday);
            setAppts(prev => [...prev, SB.consultaToAppointment(res.data, targetMonday)]);
            return;
          }
        }
        // Fallback: modo demonstração (sem Supabase) — grava local com o
        // `day` já calculado pra semana certa, e pula a agenda pra lá.
        setCurrentMonday(targetMonday);
        setAppts(prev => [...prev, { ...a, day: dayIndex }]);
      }, [dbConnected, patients]);

      const addPatient = useCallback(async (p) => {
        if (dbConnected) {
          const res = await SB.createPaciente({
            nome: p.name,
            telefone: p.phone,
            email: p.email,
            convenio: p.convenio,
            data_nasc: p.data_nasc,
            bot_pausado: p.bot_pausado,
          });
          if (res.data) {
            setPatients(prev => [SB.pacienteToPatient(res.data), ...prev]);
            return;
          }
        }
        // Fallback: add locally
        setPatients(prev => [p, ...prev]);
      }, [dbConnected]);

      const updatePatient = useCallback(async (id, updates) => {
        // Update locally first (optimistic)
        setPatients(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));

        if (dbConnected) {
          const payload = {
            nome: updates.name,
            telefone: updates.phone,
            email: updates.email,
            convenio: updates.convenio,
            status: updates.status,
            data_nasc: updates.data_nasc,
          };
          const res = await SB.updatePaciente(id, payload);
          if (res.data) {
            setPatients(prev => prev.map(p => p.id === id ? SB.pacienteToPatient(res.data) : p));
          }
        }
      }, [dbConnected]);

      const addProfissional = useCallback(async (nome) => {
        const nomeLimpo = (nome || '').trim();
        if (!nomeLimpo) return;
        const tempId = 'temp_' + Date.now();
        const novo = { id: tempId, nome: nomeLimpo, ativo: true, criado_em: new Date().toISOString() };
        setProfissionais(prev => [...prev, novo].sort((a, b) => a.nome.localeCompare(b.nome)));

        if (dbConnected) {
          const res = await SB.createProfissional(nomeLimpo);
          if (res.data) {
            setProfissionais(prev => prev.map(p => p.id === tempId ? res.data : p));
          }
        }
      }, [dbConnected]);

      const toggleProfissionalAtivo = useCallback(async (id, novoAtivo) => {
        setProfissionais(prev => prev.map(p => p.id === id ? { ...p, ativo: novoAtivo } : p));

        if (dbConnected) {
          await SB.updateProfissional(id, { ativo: novoAtivo });
        }
      }, [dbConnected]);

      // Kill switch: desliga só a resposta automática da IA no WhatsApp.
      // Mensagem do paciente continua chegando e logada no CRM (handoff pra
      // humano, não buraco negro — mesmo raciocínio do D-23).
      const toggleBotAtivo = useCallback(async (novoAtivo) => {
        setBotAtivo(novoAtivo);
        if (dbConnected) {
          await SB.updateBotAtivo(novoAtivo);
        }
      }, [dbConnected]);

      const profissionaisAtivos = useMemo(
        () => profissionais.filter(p => p.ativo),
        [profissionais]
      );

      // Pedido do bot ainda não tem horário: o `data_hora` que ele carrega é o
      // now() de quando foi criado, só porque a coluna é NOT NULL. Deixá-lo na
      // grade faria a agenda mostrar compromissos que ninguém marcou.
      // A agenda passa a significar "o que está marcado de verdade"; os pedidos
      // vivem na aba "Solicitadas", que é onde a triagem acontece.
      // 'recusado' também fica fora: é arquivo, não agenda.
      const naAgenda = useMemo(
        () => appts.filter(a => a.status !== 'solicitado' && a.status !== 'recusado'),
        [appts]
      );
      const pedidos = useMemo(
        () => appts.filter(a => a.status === 'solicitado'),
        [appts]
      );

      const counts = {
        todas:       naAgenda.length,
        confirmed:   appts.filter(a => a.status === 'confirmed').length,
        pending:     appts.filter(a => a.status === 'pending').length,
        solicitado:  pedidos.length,
        rescheduled: appts.filter(a => a.status === 'rescheduled').length,
        canceled:    appts.filter(a => a.status === 'canceled').length,
      };
      const filteredList = filter === 'todas' ? naAgenda : appts.filter(a => a.status === filter);

      return (
        <div style={{ display:'flex', height:'100vh', overflow:'hidden', background:'var(--supabase-bg-studio)' }}>
          <Sidebar accent={accent} currentPage={page} onNavigate={setPage}
            onOpenSettings={() => setSettingsOpen(true)} />

          {/* Main column */}
          <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>

            {page === 'agenda' && (
              <React.Fragment>
                <AgendaHeader
                  accent={accent} counts={counts} filter={filter} setFilter={setFilter}
                  layout={t.layout} setLayout={v => setTweak('layout', v)}
                  onNewAppt={() => setNewApptOpen(true)}
                  currentMonday={currentMonday}
                  onPrevWeek={() => {
                    const d = new Date(currentMonday);
                    d.setDate(d.getDate() - 7);
                    setCurrentMonday(d);
                  }}
                  onNextWeek={() => {
                    const d = new Date(currentMonday);
                    d.setDate(d.getDate() + 7);
                    setCurrentMonday(d);
                  }}
                />
                <div style={{ flex:1, overflow:'hidden', display:'flex', minHeight:0 }}>
                  {t.layout === 'lista' && (
                    <div key="lista" style={{ flex:1, display:'flex', minWidth:0, minHeight:0, overflow:'hidden', animation:'fadeIn .2s var(--ease-premium)' }}>
                      <ListView appointments={filteredList} selectedId={selectedId}
                        onSelect={setSelectedId} accent={accent} />
                    </div>
                  )}
                  {t.layout === 'calendário' && (
                    <div key="calendario" style={{ flex:1, display:'flex', minWidth:0, minHeight:0, overflow:'hidden', animation:'fadeIn .2s var(--ease-premium)' }}>
                      <CalendarView appointments={naAgenda} selectedId={selectedId}
                        onSelect={setSelectedId} accent={accent} onMove={moveAppt}
                        currentMonday={currentMonday} />
                    </div>
                  )}
                  {t.layout === 'kanban' && (
                    <div key="kanban" style={{ flex:1, display:'flex', minWidth:0, minHeight:0, overflow:'hidden', animation:'fadeIn .2s var(--ease-premium)' }}>
                      <KanbanView appointments={naAgenda} selectedId={selectedId}
                        onSelect={setSelectedId} accent={accent} />
                    </div>
                  )}
                  {selected && (
                    <DetailPanel appointment={selected} onClose={() => setSelectedId(null)}
                      accent={accent}
                      onUpdateStatus={(id, status) => updateConsulta(id, { status })}
                      onDelete={deleteAppt}
                      onUpdatePreco={(id, preco) => updateConsulta(id, { preco })}
                      onUpdateDuracao={(id, dur) => updateDuracao(id, dur)}
                      onAprovarPedido={setPedidoEmAprovacao}
                      onAvisarPaciente={avisarPacienteDoHorario}
                    />
                  )}
                </div>
              </React.Fragment>
            )}

            {page === 'patients' && (
              <PatientsView
                patients={patients}
                onAddPatient={() => setNewPatientOpen(true)}
                onNewAppointment={() => setNewApptOpen(true)}
                onEditPatient={setEditingPatient}
                accent={accent}
              />
            )}

            {page === 'atendimentos' && (
              <AtendimentosView accent={accent} />
            )}

            {page === 'reports' && (
              <ReportsView accent={accent} />
            )}

            {page === 'automation' && (
              <AutomationView accent={accent} />
            )}
          </div>

          {/* ── Modals ─────────────────────────────────────────────── */}
          {pedidoEmAprovacao && (
            <AprovarPedidoModal
              accent={accent}
              pedido={pedidoEmAprovacao}
              preferencia={extrairPreferencia(pedidoEmAprovacao.notas)}
              onClose={() => setPedidoEmAprovacao(null)}
              onSave={aprovarPedido}
              profissionais={profissionaisAtivos}
            />
          )}
          {newApptOpen && (
            <NewAppointmentModal
              accent={accent}
              patients={patients}
              onClose={() => setNewApptOpen(false)}
              onSave={addAppt}
              currentMonday={currentMonday}
              profissionais={profissionaisAtivos}
            />
          )}
          {newPatientOpen && (
            <AddPatientModal
              accent={accent}
              onClose={() => setNewPatientOpen(false)}
              onSave={addPatient}
            />
          )}
          {editingPatient && (
            <EditPatientModal
              accent={accent}
              patient={editingPatient}
              onClose={() => setEditingPatient(null)}
              onSave={async (updatedData) => {
                await updatePatient(editingPatient.id, updatedData);
                setEditingPatient(null);
              }}
            />
          )}

          {/* ── Configurações (aberto pelo item da sidebar) ─────────── */}
          {settingsOpen && (
            <SettingsModal
              theme={t.theme || 'dark'}
              accentKey={t.accent}
              onSetTheme={v => setTweak('theme', v)}
              onSetAccent={v => setTweak('accent', v)}
              accent={accent}
              profissionais={profissionais}
              onAddProfissional={addProfissional}
              onToggleProfissionalAtivo={toggleProfissionalAtivo}
              botAtivo={botAtivo}
              onToggleBotAtivo={toggleBotAtivo}
              onClose={() => setSettingsOpen(false)}
            />
          )}

          {/* ── Tweaks ──────────────────────────────────────────────── */}
          <TweaksPanel title="Cliniflow Tweaks">
            <TweakSection label="Visualização" />
            <TweakRadio label="Layout" value={t.layout}
              options={['lista','calendário','kanban']}
              onChange={v => setTweak('layout', v)} />
            <TweakSection label="Aparência" />
            <TweakRadio label="Accent" value={t.accent}
              options={['verde','azul','violeta','cyan']}
              onChange={v => setTweak('accent', v)} />
            <TweakRadio label="Tema" value={t.theme || 'dark'}
              options={[{value:'dark', label:'Dark'}, {value:'light', label:'Light'}]}
              onChange={v => setTweak('theme', v)} />
            <TweakToggle label="Compacto" value={t.compacto}
              onChange={v => setTweak('compacto', v)} />
          </TweaksPanel>
        </div>
      );
    }

    function ToggleSwitch({ checked, onChange, accent }) {
      return (
        <button
          type="button"
          onClick={() => onChange(!checked)}
          style={{
            width:34, height:20, borderRadius:10, padding:2, border:'none', cursor:'pointer',
            background: checked ? accent : 'var(--supabase-bg-hover)',
            display:'flex', justifyContent: checked ? 'flex-end' : 'flex-start',
            transition:'background .15s var(--ease-premium)', flexShrink:0,
          }}
        >
          <span style={{
            width:16, height:16, borderRadius:'50%', background:'#fff',
            boxShadow:'var(--shadow-sm)', display:'block',
            transition:'transform .15s var(--ease-premium)',
          }} />
        </button>
      );
    }

    function ProfissionaisIcon({ size=15, color }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={{flexShrink:0}}>
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
        </svg>
      );

    // ── Configurações: tema, cor de destaque e profissionais ─────────────
    // Aberto pelo item "Configurações" da sidebar.
    function SettingsModal({ theme, accentKey, onSetTheme, onSetAccent, accent, onClose, profissionais = [], onAddProfissional, onToggleProfissionalAtivo, botAtivo = true, onToggleBotAtivo }) {
      const [novoNome, setNovoNome] = useState('');

      const sectionLabelStyle = {
        fontSize:11, fontWeight:600, color:'var(--supabase-text-muted)',
        textTransform:'uppercase', letterSpacing:.7, marginBottom:8,
        display:'flex', alignItems:'center', gap:6,
      };

      const optBtn = (active) => ({
        flex:1, padding:'8px 10px', borderRadius:6, cursor:'pointer',
        background: active ? `${accent}18` : 'var(--supabase-bg-input)',
        border: `1px solid ${active ? accent : 'var(--supabase-border)'}`,
        color: active ? accent : 'var(--supabase-text-muted)',
        fontSize:12.5, fontWeight: active ? 600 : 500,
      });

      const handleAdd = (e) => {
        e.preventDefault();
        if (novoNome.trim() && onAddProfissional) {
          onAddProfissional(novoNome.trim());
          setNovoNome('');
        }
      };

      return (
        <Modal title="Configurações" onClose={onClose} accent={accent} width={420}>
          <div style={{ padding:'18px', display:'flex', flexDirection:'column', gap:18 }}>
            <div>
              <div style={sectionLabelStyle}>
                <ThemeIcon color="var(--supabase-text-muted)" />
                <span>Tema</span>
              </div>
              <div style={{ display:'flex', gap:8 }}>
                <button style={optBtn(theme === 'dark')} onClick={() => onSetTheme('dark')}>Escuro</button>
                <button style={optBtn(theme === 'light')} onClick={() => onSetTheme('light')}>Claro</button>
              </div>
            </div>

            <div>
              <div style={sectionLabelStyle}>
                <PaletteIcon color="var(--supabase-text-muted)" />
                <span>Cor de destaque</span>
              </div>
              <div style={{ display:'flex', gap:8 }}>
                {Object.entries(ACCENT_MAP).map(([key, hex]) => (
                  <button key={key} title={key} onClick={() => onSetAccent(key)} style={{
                    width:34, height:34, borderRadius:'50%', cursor:'pointer',
                    background:hex,
                    border: accentKey === key ? '2px solid var(--supabase-text)' : '2px solid transparent',
                    outline: accentKey === key ? `2px solid ${hex}55` : 'none',
                  }} />
                ))}
              </div>
            </div>

            <div style={{ borderTop:'1px solid var(--supabase-border)', paddingTop:16 }}>
              <div style={{ ...sectionLabelStyle, justifyContent:'space-between', marginBottom:6 }}>
                <span>Bot de IA</span>
                <ToggleSwitch
                  checked={botAtivo}
                  accent={accent}
                  onChange={v => onToggleBotAtivo && onToggleBotAtivo(v)}
                />
              </div>
              <p style={{ fontSize:11.5, color:'var(--supabase-text-muted)', margin:0, lineHeight:1.4 }}>
                {botAtivo
                  ? 'A IA responde automaticamente no WhatsApp.'
                  : 'IA desligada: mensagens continuam chegando no CRM, mas ninguém responde sozinho.'}
              </p>
            </div>

            <div style={{ borderTop:'1px solid var(--supabase-border)', paddingTop:16 }}>
              <div style={{ ...sectionLabelStyle, justifyContent:'space-between' }}>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <ProfissionaisIcon color="var(--supabase-text-muted)" />
                  <span>Profissionais</span>
                </div>
                <span style={{ fontSize:10, textTransform:'none', fontWeight:400, color:'var(--supabase-icon-inactive)' }}>
                  {profissionais.filter(p => p.ativo).length} ativo(s)
                </span>
              </div>

              <div style={{ maxHeight:160, overflowY:'auto', display:'flex', flexDirection:'column', gap:6, marginBottom:8 }}>
                {profissionais.length === 0 ? (
                  <div style={{
                    fontSize:12, color:'var(--supabase-text-muted)', padding:'12px',
                    background:'var(--supabase-bg-input)', border:'1px solid var(--supabase-border)',
                    borderRadius:'var(--radius-studio)', textAlign:'center',
                  }}>
                    Nenhum profissional cadastrado.
                  </div>
                ) : (
                  profissionais.map(p => (
                    <div key={p.id} style={{
                      display:'flex', alignItems:'center', justifyContent:'space-between',
                      padding:'6px 10px', background:'var(--supabase-bg-input)',
                      border:'1px solid var(--supabase-border)', borderRadius:'var(--radius-studio)',
                    }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8, minWidth:0, flex:1 }}>
                        <span style={{
                          width:7, height:7, borderRadius:'50%', flexShrink:0,
                          background: p.ativo ? '#3ecf8e' : 'var(--supabase-text-muted)',
                        }} />
                        <span style={{
                          fontSize:12.5, fontWeight:500,
                          color: p.ativo ? 'var(--supabase-text)' : 'var(--supabase-text-muted)',
                          textDecoration: p.ativo ? 'none' : 'line-through',
                          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                        }}>{p.nome}</span>
                      </div>
                      <ToggleSwitch
                        checked={p.ativo}
                        accent={accent}
                        onChange={v => onToggleProfissionalAtivo && onToggleProfissionalAtivo(p.id, v)}
                      />
                    </div>
                  ))
                )}
              </div>

              <form onSubmit={handleAdd} style={{ display:'flex', gap:6, marginTop:6 }}>
                <input
                  type="text"
                  value={novoNome}
                  onChange={e => setNovoNome(e.target.value)}
                  placeholder="Nome do profissional (ex: Dra. Ana)"
                  style={{
                    flex:1, padding:'7px 10px', fontSize:12,
                    background:'var(--supabase-bg-input)', border:'1px solid var(--supabase-border)',
                    borderRadius:'var(--radius-studio)', color:'var(--supabase-text)', outline:'none',
                  }}
                />
                <button
                  type="submit"
                  disabled={!novoNome.trim()}
                  style={{
                    padding:'7px 12px', borderRadius:'var(--radius-studio)',
                    background: novoNome.trim() ? accent : 'var(--supabase-bg-hover)',
                    border:'none', color: novoNome.trim() ? '#000' : 'var(--supabase-icon-inactive)',
                    fontSize:12, fontWeight:600, cursor: novoNome.trim() ? 'pointer' : 'not-allowed',
                    flexShrink:0,
                  }}
                >
                  Adicionar
                </button>
              </form>
            </div>
          </div>
        </Modal>
      );
    }

    function AgendaHeader({ accent, counts, filter, setFilter, layout, setLayout, onNewAppt, currentMonday, onPrevWeek, onNextWeek }) {
      const formatWeekLabel = () => {
        const mon = new Date(currentMonday);
        const fri = new Date(currentMonday);
        fri.setDate(currentMonday.getDate() + 5);
        const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        
        let label = `Semana de ${mon.getDate()}`;
        if (mon.getMonth() !== fri.getMonth()) {
          label += ` de ${months[mon.getMonth()]}`;
        }
        label += `–${fri.getDate()} de ${months[fri.getMonth()]} · ${mon.getFullYear()}`;
        return label;
      };

      return (
        <div style={{ padding:'18px 20px', borderBottom:'1px solid #191919', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18 }}>
            <div style={{ display:'flex', alignItems:'center', gap:14 }}>
              <h1 style={{ fontSize:15.5, fontWeight:600, color:'var(--supabase-text)', letterSpacing:'-.35px' }}>Agenda</h1>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <NavBtn onClick={onPrevWeek}>‹</NavBtn>
                <span style={{ fontSize:13, color:'#777', fontWeight:400, padding:'0 4px' }}>
                  {formatWeekLabel()}
                </span>
                <NavBtn onClick={onNextWeek}>›</NavBtn>
              </div>
            </div>

            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <div style={{
                display:'flex', background:'var(--supabase-bg-input)', border:'1px solid var(--supabase-border)',
                borderRadius:8, padding:3, gap:2,
              }}>
                {Object.entries(LAYOUT_ICONS).map(([id, icon]) => (
                  <LayoutBtn key={id} active={layout === id}
                    onClick={() => setLayout(id)}
                    accent={accent} icon={icon} label={id} />
                ))}
              </div>

              <button onClick={onNewAppt} style={{
                display:'flex', alignItems:'center', gap:5,
                padding:'6px 13px', borderRadius:'var(--radius-studio)',
                background: accent, border:'none',
                color:'var(--supabase-bg-studio)', fontSize:12.5, fontWeight:600,
                cursor:'pointer', letterSpacing:'-.2px', flexShrink:0, whiteSpace:'nowrap',
                transition:'var(--transition-studio)'
              }}>
                <span style={{ fontSize:16, lineHeight:1, marginTop:-1 }}>+</span> Nova consulta
              </button>
            </div>
          </div>

          <div style={{
            display:'flex', alignItems:'center', gap:2,
            background:'var(--supabase-bg-card)', border:'1px solid var(--supabase-border)',
            borderRadius:8, padding:3, width:'fit-content',
          }}>
            {FILTER_TABS.map(tab => {
              const active = filter === tab.id;
              return (
                <button key={tab.id} onClick={() => setFilter(tab.id)} style={{
                  padding:'6px 12px', border:'none', borderRadius:'var(--radius-studio)',
                  background: active ? accent : 'transparent',
                  color: active ? 'var(--supabase-bg-studio)' : '#8a8a8a',
                  fontSize:12.5, fontWeight: active ? 600 : 400,
                  cursor:'pointer', display:'flex', alignItems:'center', gap:6,
                  transition:'all .13s', whiteSpace:'nowrap',
                }}>
                  {tab.label}
                  <span style={{ opacity: active ? 0.7 : 0.6 }}>{counts[tab.id]}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ── Coming-soon stub ───────────────────────────────────────────────────

      return (
        <div style={{
          flex:1, display:'flex', alignItems:'center', justifyContent:'center',

        <button
          onClick={onClick}
          onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            width:22, height:22, borderRadius:4,
            background: hov ? '#1c1c1c' : 'transparent',
            border:'none', color: hov ? '#aaa' : '#444',
            cursor:'pointer', fontSize:16, lineHeight:'22px',
            display:'flex', alignItems:'center', justifyContent:'center',
            transition:'all .12s',
          }}>
          {children}
        </button>
      );
    }

    function StatChip({ value, label, color }) {
      return (
        <div style={{
          display:'flex', alignItems:'center', gap:5,
          padding:'3px 8px', borderRadius:5,
          background:`${color}0e`, border:`1px solid ${color}22`,
        }}>
          <span style={{ width:6, height:6, borderRadius:'50%', background:color, flexShrink:0 }} />
          <span style={{ fontSize:11, fontWeight:600, color }}>{value}</span>
          <span style={{ fontSize:11, color:'#3a3a3a' }}>{label}</span>
        </div>
      );

    function LayoutBtn({ active, onClick, accent, icon, label }) {
      const displayLabel = label.charAt(0).toUpperCase() + label.slice(1);
      return (
        <button onClick={onClick}
          title={displayLabel}
          style={{
            padding:'7px 12px', borderRadius:'var(--radius-studio)', border:'none',
            background: active ? accent : 'transparent',
            color: active ? 'var(--supabase-bg-studio)' : '#6a6a6a',
            fontSize:12, fontWeight: active ? 600 : 400,
            boxShadow: active ? '0 2px 6px rgba(62,207,142,.35), 0 1px 0 rgba(255,255,255,.2) inset' : 'none',
            cursor:'pointer', transition:'all .12s', whiteSpace:'nowrap',
            display:'flex', alignItems:'center', gap:6,
          }}>
          {icon}{displayLabel}
        </button>
      );
    }

    // ── Login ──────────────────────────────────────────────────────────────

    function LoginScreen() {
      const [modo, setModo] = useState('entrar'); // 'entrar' | 'criar'
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [confirmarSenha, setConfirmarSenha] = useState('');
      const [erro, setErro] = useState('');
      const [aviso, setAviso] = useState('');
      const [enviando, setEnviando] = useState(false);
      const criando = modo === 'criar';

      const inputStyle = {
        width:'100%', padding:'9px 11px', fontSize:14,
        background:'var(--supabase-bg-input)', color:'var(--supabase-text-light)',
        border:'1px solid var(--supabase-border)', borderRadius:8,
        outline:'none',
      };

      function trocarModo(novo) {
        if (enviando || novo === modo) return;
        setModo(novo);
        setErro('');
        setAviso('');
        setConfirmarSenha('');
      }

      async function enviar(e) {
        e.preventDefault();
        if (enviando) return;
        setErro('');
        setAviso('');
        if (criando && senha !== confirmarSenha) {
          setErro('As senhas não coincidem.');
          return;
        }
        setEnviando(true);
        const res = criando
          ? await SB.signUp(email.trim(), senha)
          : await SB.signIn(email.trim(), senha);
        if (!res.success) {
          setErro(res.error);
          setEnviando(false);
          return;
        }
        // Conta criada sem sessão = "Confirm email" ligado no Supabase: a tela
        // fica onde está e o acesso só acontece depois do link do e-mail.
        if (res.precisaConfirmar) {
          setAviso('Conta criada. Confirme o link que enviamos para ' + email.trim() + ' e depois entre.');
          setModo('entrar');
          setSenha('');
          setConfirmarSenha('');
          setEnviando(false);
        }
        // sucesso com sessão: o onAuthStateChange no Root troca a tela.
      }

      async function entrarComGoogle() {
        if (enviando) return;
        setErro('');
        const res = await SB.signInWithGoogle();
        // sucesso: a página é redirecionada para o Google — nada mais a fazer aqui.
        if (!res.success) setErro(res.error);
      }

      return (
        <div style={{
          height:'100%', display:'flex', alignItems:'center', justifyContent:'center',
          background:'var(--supabase-bg-studio)',
        }}>
          <form onSubmit={enviar} style={{
            width:360, padding:32, borderRadius:16,
            background:'var(--supabase-bg-card)',
            border:'1px solid var(--supabase-border)',
            boxShadow:'var(--shadow-lg)',
            animation:'slideUp 0.5s var(--ease-premium)',
            display:'flex', flexDirection:'column', gap:14,
          }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
              <div style={{
                width:32, height:32, borderRadius:9, flexShrink:0,
                background:'linear-gradient(135deg, var(--supabase-brand), #22d3ee)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:15, fontWeight:700, color:'#0f0f0f',
              }}>C</div>
              <div>
                <div style={{ fontSize:17, fontWeight:600, color:'var(--supabase-text)', lineHeight:1.2 }}>
                  Cliniflow
                </div>
                <div style={{ fontSize:12.5, color:'var(--supabase-text-muted)' }}>
                  {criando ? 'Crie a conta da sua clínica' : 'Entre para continuar'}
                </div>
              </div>
            </div>

            <div style={{
              display:'flex', gap:4, padding:3, borderRadius:9,
              background:'var(--supabase-bg-input)', border:'1px solid var(--supabase-border)',
            }}>
              {[['entrar','Entrar'], ['criar','Criar conta']].map(([valor, rotulo]) => (
                <button key={valor} type="button" onClick={() => trocarModo(valor)} style={{
                  flex:1, padding:'6px 10px', fontSize:13,
                  fontWeight: modo === valor ? 600 : 400,
                  background: modo === valor ? 'var(--supabase-bg-card)' : 'transparent',
                  color: modo === valor ? 'var(--supabase-text)' : 'var(--supabase-text-muted)',
                  border:'none', borderRadius:7,
                  cursor: enviando ? 'default' : 'pointer',
                }}>
                  {rotulo}
                </button>
              ))}
            </div>

            <input
              type="email" autoComplete="username" placeholder="E-mail da clínica" required
              value={email} onChange={e => setEmail(e.target.value)}
              style={inputStyle}
            />
            <input
              type="password" required minLength={criando ? 6 : undefined}
              autoComplete={criando ? 'new-password' : 'current-password'}
              placeholder={criando ? 'Senha (mínimo 6 caracteres)' : 'Senha'}
              value={senha} onChange={e => setSenha(e.target.value)}
              style={inputStyle}
            />
            {criando && (
              <input
                type="password" required minLength={6}
                autoComplete="new-password"
                placeholder="Confirmar senha"
                value={confirmarSenha} onChange={e => setConfirmarSenha(e.target.value)}
                style={inputStyle}
              />
            )}

            {erro && (
              <div style={{ fontSize:13, color:'#f87171' }}>{erro}</div>
            )}
            {aviso && (
              <div style={{ fontSize:13, color:'var(--supabase-brand)' }}>{aviso}</div>
            )}

            <button type="submit" disabled={enviando} style={{
              padding:'9px 11px', fontSize:14, fontWeight:600,
              background:'var(--supabase-brand)', color:'#0f0f0f',
              border:'none', borderRadius:8,
              boxShadow:'0 4px 14px -4px rgba(62,207,142,0.5)',
              cursor: enviando ? 'default' : 'pointer',
              opacity: enviando ? 0.6 : 1,
            }}>
              {enviando ? '...' : (criando ? 'Criar conta' : 'Entrar')}
            </button>

            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ flex:1, height:1, background:'var(--supabase-border)' }} />
              <span style={{ fontSize:12, color:'var(--supabase-text-muted)' }}>ou</span>
              <div style={{ flex:1, height:1, background:'var(--supabase-border)' }} />
            </div>

            <button type="button" onClick={entrarComGoogle} disabled={enviando} style={{
              padding:'9px 11px', fontSize:14, fontWeight:600,
              background:'transparent', color:'var(--supabase-text-light)',
              border:'1px solid var(--supabase-border)', borderRadius:8,
              cursor: enviando ? 'default' : 'pointer',
              opacity: enviando ? 0.6 : 1,
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            }}>
              <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.5-6.5C35.3 2.5 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.6 5.9C12 13 17.5 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.6 37.6 46.5 31.6 46.5 24.5z"/>
                <path fill="#FBBC05" d="M10.1 19.1a14.6 14.6 0 0 0 0 9.8l-7.6 5.9a24 24 0 0 1 0-21.6l7.6 5.9z"/>
                <path fill="#34A853" d="M24 48c6 0 11.3-2 15-5.4l-7.3-5.7c-2 1.4-4.6 2.2-7.7 2.2-6.5 0-12-4.5-13.9-10.5l-7.6 5.9C6.5 42.6 14.6 48 24 48z"/>
              </svg>
              Entrar com o Google
            </button>
          </form>
        </div>
      );
    }

    // ── Onboarding: cria a clínica quando a sessão não tem vínculo ──────────
    // D-OPEN-4 (decidido em 29/07/2026, reabre a D-6): só aparece para quem
    // logou e cujo auth_clinic_id() voltou NULL. A RPC registrar_clinica gera
    // o clinic_id no servidor — o frontend nunca escolhe nem envia um.
    function OnboardingClinica({ onCriada }) {
      const [nome, setNome] = useState('');
      const [erro, setErro] = useState('');
      const [enviando, setEnviando] = useState(false);

      const inputStyle = {
        width:'100%', padding:'9px 11px', fontSize:14,
        background:'var(--supabase-bg-input)', color:'var(--supabase-text-light)',
        border:'1px solid var(--supabase-border)', borderRadius:8,
        outline:'none',
      };

      async function cadastrar(e) {
        e.preventDefault();
        if (enviando || !nome.trim()) return;
        setErro('');
        setEnviando(true);
        const res = await SB.registrarClinica(nome.trim());
        if (!res.success) {
          setErro(res.error);
          setEnviando(false);
          return;
        }
        onCriada(res.clinicId);
      }

      return (
        <div style={{
          height:'100%', display:'flex', alignItems:'center', justifyContent:'center',
          background:'var(--supabase-bg-studio)',
        }}>
          <form onSubmit={cadastrar} style={{
            width:360, padding:32, borderRadius:16,
            background:'var(--supabase-bg-card)',
            border:'1px solid var(--supabase-border)',
            boxShadow:'var(--shadow-lg)',
            animation:'slideUp 0.5s var(--ease-premium)',
            display:'flex', flexDirection:'column', gap:14,
          }}>
            <div style={{ fontSize:17, fontWeight:600, color:'var(--supabase-text)' }}>
              Cadastre sua clínica
            </div>
            <div style={{ fontSize:13, color:'var(--supabase-text-muted)' }}>
              Sua conta ainda não está vinculada a nenhuma clínica.
            </div>

            <input
              type="text" placeholder="Nome da clínica" required
              value={nome} onChange={e => setNome(e.target.value)}
              style={inputStyle}
            />

            {erro && (
              <div style={{ fontSize:13, color:'#f87171' }}>{erro}</div>
            )}

            <button type="submit" disabled={enviando} style={{
              padding:'9px 11px', fontSize:14, fontWeight:600,
              background:'var(--supabase-brand)', color:'#0f0f0f',
              border:'none', borderRadius:8,
              cursor: enviando ? 'default' : 'pointer',
              opacity: enviando ? 0.6 : 1,
            }}>
              {enviando ? '...' : 'Criar clínica'}
            </button>
          </form>
        </div>
      );
    }

    // ── Root: portão de autenticação ───────────────────────────────────────
    // O App só monta quando há sessão. Isso é o que garante que as inscrições
    // do Realtime (criadas nos useEffect do App) subam com JWT — sem isso, com
    // o RLS fechado, o canal sobe sem token e não entrega evento nenhum, em
    // silêncio. Ver docs/plano-auth-rls.md, armadilhas 3.4 e 6.2.

    function Root() {
      const [session, setSession] = useState(null);
      const [clinicId, setClinicId] = useState(null);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        // Sem Supabase configurado o CRM roda em modo de demonstração (mock),
        // como antes — não faz sentido pedir login para dado falso.
        if (!SB || !SB.isConnected()) {
          setCarregando(false);
          return;
        }

        let sub = null;
        // auth_clinic_id() é buscado junto da sessão: uma conta autenticada
        // sem vínculo (login novo via Google) cai no onboarding, não no App.
        async function aplicarSessao(s) {
          setSession(s);
          setClinicId(s ? await SB.getClinicId() : null);
        }

        (async () => {
          const s = await SB.getSession();
          await aplicarSessao(s);
          setCarregando(false);
          sub = SB.onAuthStateChange(s2 => {
            setCarregando(true);
            aplicarSessao(s2).then(() => setCarregando(false));
          });
        })();

        return () => { if (sub) sub.unsubscribe(); };
      }, []);

      if (carregando) {
        return (
          <div style={{
            height:'100%', display:'flex', alignItems:'center', justifyContent:'center',
            background:'var(--supabase-bg-studio)', color:'var(--supabase-text-muted)', fontSize:14,
          }}>
            Carregando...
          </div>
        );
      }

      const modoDemo = !SB || !SB.isConnected();
      if (!modoDemo && !session) return <LoginScreen />;
      if (!modoDemo && session && !clinicId) {
        return <OnboardingClinica onCriada={setClinicId} />;
      }

      // key força o App a remontar quando a conta muda, refazendo as inscrições.
      return <App key={session ? session.user.id : 'demo'} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
